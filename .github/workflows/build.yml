
name: Build HauntClient

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check files
        run: |
          echo "Repository root:"
          ls -la
          echo "Project folder:"
          ls -la hauntclient-fabric-1.21.4
          test -f hauntclient-fabric-1.21.4/build.gradle

      - name: Build mod
        run: gradle -p hauntclient-fabric-1.21.4 build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HauntClient
          path: hauntclient-fabric-1.21.4/build/libs/*.jar
          if-no-files-found: error
