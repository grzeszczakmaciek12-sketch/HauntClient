
name: Build HauntClient

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hauntclient-fabric-1.21.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Verify Gradle files
        run: |
          pwd
          ls -la
          test -f build.gradle
          test -f settings.gradle

      - name: Build mod
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HauntClient
          path: hauntclient-fabric-1.21.4/build/libs/*.jar
          if-no-files-found: error
