
name: Build HauntClient

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Show project files
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 5 \( -name "build.gradle" -o -name "settings.gradle" \)

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build mod
        run: |
          if [ -f build.gradle ]; then
            gradle build
          elif [ -f HauntClient/build.gradle ]; then
            cd HauntClient
            gradle build
          else
            echo "ERROR: Nie znaleziono build.gradle!"
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HauntClient
          path: |
            build/libs/*.jar
            HauntClient/build/libs/*.jar
          if-no-files-found: error
